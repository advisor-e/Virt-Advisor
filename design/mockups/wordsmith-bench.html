<style>

  nav.styles button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }

  .card-head .tag { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
  .block { display: grid; gap: 6px; }
  .label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

<script type="application/json" id="guide">{"Vision":{"doc":"Speaking to your stakeholders: where you see the business in future, and when. Page 7 of your Alignment document puts Vision in the Being domain. It answers Where and When, and delivers Contextual Awareness.","best":["A picture of a future the business can actually reach, with a finish line, so everyone will know when it has been achieved (Collins & Porras).","Pitched as a stretch: a 10 to 30 year goal with roughly 50 to 70 per cent odds, which the team still believes it can hit.","Described vividly enough that people can picture it. It turns the vision from words into pictures.","Specific to this business. \"Recognised leader in the insurance field\" fails because any firm could say it (Collis & Rukstad)."],"differs":"Vision can be reached and carries a date. Purpose is never finished. In your method, Mission is the next milestone on the way to the Vision, and Strategy is how you intend to get there.","tension":"Best practice mostly writes the vision for the people inside the business; your document writes it for stakeholders. Both expect a when. You gave no date, so neither draft has one.","sources":[{"name":"Collins & Porras, Building Your Company's Vision, HBR 1996","url":"https://hbr.org/1996/09/building-your-companys-vision"},{"name":"Collis & Rukstad, Can You Say What Your Strategy Is?, HBR 2008","url":"https://hbr.org/2008/04/can-you-say-what-your-strategy-is"}]},"Purpose":{"doc":"Speaking to both Customers and Stakeholders: why you do what you do beyond economic requirement. Page 7 puts Purpose in the Knowing domain. It answers Why, and delivers Frameworks.","best":["The reason the business exists beyond making money. It lasts indefinitely and is never achieved: \"a guiding star on the horizon, forever pursued but never reached\" (Collins & Porras).","Found by asking \"why is that important?\" five times, starting from what the business makes.","A common form is \"To [contribution] so that [impact]\" (Simon Sinek).","It does not have to be unique, and \"maximise shareholder wealth\" is never a purpose."],"differs":"Vision says where you are going; Purpose says why. Values guide how you behave on the way. Drucker, and Collis & Rukstad, call this statement the \"mission\". In your method it is Purpose.","tension":"Your page 7 warns that the \"discover your WHY\" fashion ignores the other four domains. Much of the web's best practice (Sinek) puts WHY first. Your method treats Purpose as one of five statements in balance, not the master statement.","sources":[{"name":"Collins & Porras, Building Your Company's Vision, HBR 1996","url":"https://hbr.org/1996/09/building-your-companys-vision"},{"name":"Simon Sinek, Find Your Why","url":"https://simonsinek.com/stories/learn-simons-simple-exercise-for-finding-your-why"},{"name":"Drucker Institute, Drucker on Mission","url":"https://drucker.institute/wp-content/uploads/2018/08/Reading_Drucker-on-Mission.pdf"}]},"Values":{"doc":"Speaking to both Customers and Stakeholders: the social element, meaning how your action or inaction affects others, and what guides your decisions about how you deal with people inside and outside the business. Page 7 puts Values in the Relating domain. It answers Who, and delivers Networks.","best":["A few principles, five or six at most, that actually decide behaviour. More than that usually means practices or strategies mixed in (Collins & Porras).","The test: would we keep this value if it cost us? Real values \"inflict pain\" (Lencioni).","Separate true core values from aspirational ones, from permission-to-play ones such as honesty, which every business must meet anyway, and from accidental ones (Lencioni).","Built into hiring, reviews, promotion and dismissal. Avoid bland words: integrity, teamwork and customer focus appear on half the Fortune 100's lists, and on Enron's."],"differs":"Purpose is why the business exists. Values are how its people treat others while pursuing it. Unlike Strategy, values do not change when the market does.","tension":"Your document frames values by their effect on others, which is close to Lencioni's behaviour test. Your \"if in doubt, we'll pay out\" is exactly the kind of costly decision rule best practice asks for.","sources":[{"name":"Lencioni, Make Your Values Mean Something, HBR 2002","url":"https://hbr.org/2002/07/make-your-values-mean-something"},{"name":"Collins & Porras, Building Your Company's Vision, HBR 1996","url":"https://hbr.org/1996/09/building-your-companys-vision"}]},"Mission":{"doc":"Speaking to Stakeholders: what milestone needs to be achieved within a specified timeframe, the mission period, to ensure the success of the longer-term Vision. Page 7 puts Mission in the Having domain. It answers What, and delivers Influence.","best":["The sources disagree most here, and fall into three camps.","Camp 1: mission means the reason the business exists, and it lasts forever. Drucker says it \"should fit on a T-shirt\"; Collis & Rukstad call it \"why we exist\".","Camp 2: mission means what we do, and for whom (Bain).","Camp 3: mission means a bold goal with a finish line and a date. Collins & Porras use NASA's moon landing as the example. Your document sits in this camp: one measurable milestone, a date, and a clear step towards the Vision."],"differs":"In your method, Mission is the next staging post, Vision is the destination, and Strategy is the route. Readers from camp 1 will take a milestone mission for a purpose statement, so it helps to say which kind this is in the plan.","tension":"Your mission, a league of future professional riders representing New Zealand, has no timeframe or measure yet. By your document's own definition it is incomplete. Wordsmith should ask for the date and the measure, never invent them.","sources":[{"name":"Drucker Institute, Drucker on Mission","url":"https://drucker.institute/wp-content/uploads/2018/08/Reading_Drucker-on-Mission.pdf"},{"name":"Bain, Mission and Vision Statements","url":"https://www.bain.com/insights/management-tools-mission-and-vision-statements/"},{"name":"Collins & Porras, Building Your Company's Vision, HBR 1996","url":"https://hbr.org/1996/09/building-your-companys-vision"}]},"Strategy":{"doc":"Speaking to Board Members and Owners: the over-arching philosophy about how you intend to achieve the Vision. Page 7 puts Strategy in the Doing domain. It answers How, and delivers Leverage.","best":["A short statement of choices, not a plan. Collis & Rukstad suggest 35 words or fewer covering three things: the objective (one measurable, time-bound goal), the scope (which customers, where, and what you will not do) and the advantage (why customers choose you, and what you do that others cannot combine).","Lafley & Martin put it as two choices at the heart: where to play and how to win.","Two tests: could a competitor say the same thing? Does it say what you will not do? A plan that never says what you won't do is not a strategy (Martin)."],"differs":"Strategy is the one statement of the five expected to change as conditions change; Purpose and Values stay. Mission is the what-by-when; Strategy is the how.","tension":"Best practice puts the measurable objective inside the strategy; your document puts it in the Mission. Your strategy, technology that works rather than wizardry, plus education, quality parts and an app, names the advantage well. It doesn't yet name the scope: which riders it is not for.","sources":[{"name":"Collis & Rukstad, Can You Say What Your Strategy Is?, HBR 2008","url":"https://hbr.org/2008/04/can-you-say-what-your-strategy-is"},{"name":"Roger Martin, The Big Lie of Strategic Planning, HBR 2014","url":"https://hbr.org/2014/01/the-big-lie-of-strategic-planning"},{"name":"Roger Martin on strategy (Lenny's Newsletter)","url":"https://www.lennysnewsletter.com/p/the-ultimate-guide-to-strategy-roger-martin"}]}}</script>
<script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent)
  var GUIDE = JSON.parse(document.getElementById('guide').textContent)

  function guideBlock (name) {
    var g = GUIDE[name]
    if (!g) { return null }
    var box = el('div', 'guide')
    box.appendChild(el('div', 'label', 'What a ' + name + ' statement is for, and how it should be built'))
    function part (title, node) { var w = el('div'); w.style.display = 'grid'; w.style.gap = '4px'; w.appendChild(el('h3', null, title)); w.appendChild(node); box.appendChild(w) }
    part('Your Alignment document says', el('p', null, g.doc))
    var ul = el('ul')
    g.best.forEach(function (t) { ul.appendChild(el('li', null, t)) })
    part('Best practice says', ul)
    part('How it differs from the statements around it', el('p', null, g.differs))
    part('Where the two disagree, and what it means for your draft', el('p', null, g.tension))
    var src = el('div', 'src')
    src.appendChild(el('span', null, 'Sources:'))
    g.sources.forEach(function (s) {
      var a = el('a', null, s.name)
      a.href = s.url; a.target = '_blank'; a.rel = 'noopener'
      src.appendChild(a)
    })
    box.appendChild(src)
    return box
  }
  var notes = {}
  var db = null
  var timers = {}
  var current = 'A'
  var statusEl = document.getElementById('status')

  function el (tag, cls, text) {
    var e = document.createElement(tag)
    if (cls) { e.className = cls }
    if (text != null) { e.textContent = text }
    return e
  }

  function setStatus (text, bad) {
    statusEl.textContent = text
    statusEl.className = 'status' + (bad ? ' bad' : '')
  }

  function save (id, foot) {
    if (!db) { foot.textContent = 'Not saved: this view cannot save.'; return }
    clearTimeout(timers[id])
    foot.textContent = 'Saving…'
    foot.className = ''
    timers[id] = setTimeout(function () {
      var n = notes[id] || {}
      db.doc('notes/' + id).set({ edited: n.edited == null ? null : n.edited, thoughts: n.thoughts || '', updatedAt: new Date().toISOString() })
        .then(function () { foot.textContent = 'Saved'; foot.className = 'saved' })
        .catch(function (err) { foot.textContent = 'Not saved (' + ((err && err.code) || 'error') + '). Try typing again.'; foot.className = '' })
    }, 700)
  }

  function render () {
    var s = DATA.styles[current]
    var brief = document.getElementById('brief')
    brief.textContent = ''
    var p1 = el('div'); p1.appendChild(el('b', null, 'Purpose: ')); p1.appendChild(document.createTextNode(s.purpose))
    var p2 = el('div'); p2.appendChild(el('b', null, 'Style: ')); p2.appendChild(document.createTextNode(s.style))
    brief.appendChild(p1); brief.appendChild(p2)

    var host = document.getElementById('cards')
    host.textContent = ''
    DATA.cards.filter(function (c) { return c.style === current }).forEach(function (c) {
      var n = notes[c.id] || {}
      var card = el('article', 'card')
      var head = el('div', 'card-head')
      head.appendChild(el('h2', null, c.name))
      head.appendChild(el('span', 'tag', 'Style ' + c.style))
      card.appendChild(head)

      var b1 = el('div', 'block')
      b1.appendChild(el('div', 'label', 'What you said'))
      b1.appendChild(el('p', 'said', c.said || '(nothing dictated)'))
      card.appendChild(b1)

      var b2 = el('div', 'block')
      var l2 = el('label', 'label', 'Wordsmith’s statement (edit it here)')
      var ta = el('textarea', 'statement')
      ta.id = 'st-' + c.id
      l2.htmlFor = ta.id
      ta.value = n.edited != null ? n.edited : c.statement
      b2.appendChild(l2); b2.appendChild(ta)
      var f2 = el('div', 'row-foot')
      var reset = el('button', 'reset', 'Put back Wordsmith’s draft')
      reset.type = 'button'
      var foot = el('span', n.updatedAt ? 'saved' : '', n.updatedAt ? 'Saved' : '')
      f2.appendChild(reset); f2.appendChild(foot)
      b2.appendChild(f2)
      card.appendChild(b2)

      var b3 = el('div', 'block')
      b3.appendChild(el('div', 'label', 'Why Wordsmith wrote it this way'))
      b3.appendChild(el('p', 'why', c.why))
      card.appendChild(b3)

      var gb = guideBlock(c.name)
      if (gb) { card.appendChild(gb) }

      var b4 = el('div', 'block')
      var l4 = el('label', 'label', 'Your thoughts on this statement')
      var tb = el('textarea', 'thoughts')
      tb.id = 'th-' + c.id
      l4.htmlFor = tb.id
      tb.placeholder = 'Is it usable? What would you change, and why?'
      tb.value = n.thoughts || ''
      b4.appendChild(l4); b4.appendChild(tb)
      card.appendChild(b4)

      ta.addEventListener('input', function () {
        notes[c.id] = notes[c.id] || {}
        notes[c.id].edited = ta.value === c.statement ? null : ta.value
        save(c.id, foot)
      })
      tb.addEventListener('input', function () {
        notes[c.id] = notes[c.id] || {}
        notes[c.id].thoughts = tb.value
        save(c.id, foot)
      })
      reset.addEventListener('click', function () {
        ta.value = c.statement
        notes[c.id] = notes[c.id] || {}
        notes[c.id].edited = null
        save(c.id, foot)
      })
      host.appendChild(card)
    })
  }

  Array.prototype.forEach.call(document.querySelectorAll('nav.styles button'), function (b) {
    b.addEventListener('click', function () {
      current = b.getAttribute('data-style')
      Array.prototype.forEach.call(document.querySelectorAll('nav.styles button'), function (x) {
        x.setAttribute('aria-pressed', String(x === b))
      })
      render()
    })
  })

  render()

  if (window.claude && window.claude.use) {
    window.claude.use('db').then(function (d) {
      if (!d) { setStatus('This view cannot save. Open the page on claude.ai to keep your edits and thoughts.', true); return }
      db = d
      return db.collection('notes').get().then(function (snap) {
        var docs = (snap && snap.docs) || snap || []
        docs.forEach(function (doc) {
          var id = doc.id || (doc.ref && doc.ref.id)
          var v = typeof doc.data === 'function' ? doc.data() : (doc.data || doc)
          if (id && v) { notes[id] = v }
        })
        setStatus('Your edits and thoughts save as you type.')
        render()
      })
    }).catch(function () { setStatus('Could not load earlier notes. New typing still tries to save.', true) })
  } else {
    setStatus('This view cannot save. Open the page on claude.ai to keep your edits and thoughts.', true)
  }
})()
</script>
