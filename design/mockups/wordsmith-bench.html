<style>
  :root {
    --ground: #eef2f6; --card: #ffffff; --ink: #0f2540; --body: #2c3e52; --muted: #5d6f84;
    --line: #d6dee8; --accent: #002b64; --accent-soft: #e3ebf6; --said-bg: #f4f6f9;

    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "Open Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #0b1624; --card: #122235; --ink: #e8f0fa; --body: #cfdcea; --muted: #97aac0;
      --line: #22384f; --accent: #8fb8ee; --accent-soft: #1a3150; --said-bg: #0f1d2e;
      --field-bg: #0d1b2b; --ok: #62c795; --warn: #e2a64a;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #0b1624; --card: #122235; --ink: #e8f0fa; --body: #cfdcea; --muted: #97aac0;
    --line: #22384f; --accent: #8fb8ee; --accent-soft: #1a3150; --said-bg: #0f1d2e;
    --field-bg: #0d1b2b; --ok: #62c795; --warn: #e2a64a;
  }
  * { box-sizing: border-box; }
  body { background: var(--ground); color: var(--body); font-family: var(--sans); font-size: 15px; line-height: 1.55; padding-inline: 16px; padding-block: 28px 64px; }
  main { max-width: 860px; margin: 0 auto; display: grid; gap: 28px; }
  header { display: grid; gap: 10px; }
  .eyebrow { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  h1 { margin: 0; color: var(--ink); font-size: 1.7rem; line-height: 1.2; text-wrap: balance; }
  .lede { margin: 0; max-width: 65ch; }
  .status { font-size: 13px; color: var(--muted); }
  .status.bad { color: var(--warn); }
  nav.styles { display: flex; flex-wrap: wrap; gap: 8px; }
  nav.styles button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--card); color: var(--body); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
  nav.styles button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--card); font-weight: 600; }
  nav.styles button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .brief { background: var(--accent-soft); border-radius: 10px; padding: 12px 16px; display: grid; gap: 2px; }
  .brief b { color: var(--ink); }
  article.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; display: grid; gap: 16px; }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card-head h2 { margin: 0; color: var(--ink); font-size: 1.25rem; }
  .card-head .tag { font-size: 12px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
  .block { display: grid; gap: 6px; }
  .label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .said { background: var(--said-bg); border-radius: 8px; padding: 12px 14px; margin: 0; white-space: pre-wrap; color: var(--body); font-size: 14px; }
  textarea { width: 100%; resize: vertical; border: 1px solid var(--line); background: var(--field-bg); color: var(--ink); border-radius: 8px; padding: 12px 14px; }
  textarea.statement { font-family: var(--serif); font-size: 1.15rem; line-height: 1.5; min-height: 110px; }
  textarea.thoughts { font-family: var(--sans); font-size: 14px; min-height: 90px; }
  .why { margin: 0; font-size: 14px; color: var(--body); border-left: 3px solid var(--line); padding-left: 12px; }
  .row-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .saved { color: var(--ok); }
  button.reset { font: inherit; font-size: 12px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; text-decoration: underline; }
  @media (prefers-reduced-motion: no-preference) { article.card { transition: border-color .2s; } }
</style>

<main>
  <header>
    <div class="eyebrow">Item 15.14 · Wordsmith test · 28 Sep 2026</div>
    <h1>Your Alignment Statements, drafted two ways</h1>
    <p class="lede">For each statement: what you said, what Wordsmith drafted, and why it drafted it that way. Rewrite the draft if you want to, then put your thoughts underneath. Everything saves as you type.</p>
    <div class="status" id="status">Connecting the save…</div>
  </header>

  <nav class="styles" aria-label="Choose a style">
    <button type="button" id="tab-A" data-style="A" aria-pressed="true">A · Bank loan, professional</button>
    <button type="button" id="tab-B" data-style="B" aria-pressed="false">B · Staff room poster, humble but positive</button>
  </nav>

  <div class="brief" id="brief"></div>
  <section id="cards" style="display:grid;gap:20px"></section>
</main>

<script>
(function () {
  var DATA = JSON.parse(document.getElementById('data').textContent)
  var notes = {}
  var db = null
  var timers = {}
  var current = 'A'
  var statusEl = document.getElementById('status')

  function el (tag, cls, text) {
    var e = document.createElement(tag)
    if (cls) { e.className = cls }
    if (text != null) { e.textContent = text }
    return e
  }

  function setStatus (text, bad) {
    statusEl.textContent = text
    statusEl.className = 'status' + (bad ? ' bad' : '')
  }

  function save (id, foot) {
    if (!db) { foot.textContent = 'Not saved: this view cannot save.'; return }
    clearTimeout(timers[id])
    foot.textContent = 'Saving…'
    foot.className = ''
    timers[id] = setTimeout(function () {
      var n = notes[id] || {}
      db.doc('notes/' + id).set({ edited: n.edited == null ? null : n.edited, thoughts: n.thoughts || '', updatedAt: new Date().toISOString() })
        .then(function () { foot.textContent = 'Saved'; foot.className = 'saved' })
        .catch(function (err) { foot.textContent = 'Not saved (' + ((err && err.code) || 'error') + '). Try typing again.'; foot.className = '' })
    }, 700)
  }

  function render () {
    var s = DATA.styles[current]
    var brief = document.getElementById('brief')
    brief.textContent = ''
    var p1 = el('div'); p1.appendChild(el('b', null, 'Purpose: ')); p1.appendChild(document.createTextNode(s.purpose))
    var p2 = el('div'); p2.appendChild(el('b', null, 'Style: ')); p2.appendChild(document.createTextNode(s.style))
    brief.appendChild(p1); brief.appendChild(p2)

    var host = document.getElementById('cards')
    host.textContent = ''
    DATA.cards.filter(function (c) { return c.style === current }).forEach(function (c) {
      var n = notes[c.id] || {}
      var card = el('article', 'card')
      var head = el('div', 'card-head')
      head.appendChild(el('h2', null, c.name))
      head.appendChild(el('span', 'tag', 'Style ' + c.style))
      card.appendChild(head)

      var b1 = el('div', 'block')
      b1.appendChild(el('div', 'label', 'What you said'))
      b1.appendChild(el('p', 'said', c.said || '(nothing dictated)'))
      card.appendChild(b1)

      var b2 = el('div', 'block')
      var l2 = el('label', 'label', 'Wordsmith’s statement (edit it here)')
      var ta = el('textarea', 'statement')
      ta.id = 'st-' + c.id
      l2.htmlFor = ta.id
      ta.value = n.edited != null ? n.edited : c.statement
      b2.appendChild(l2); b2.appendChild(ta)
      var f2 = el('div', 'row-foot')
      var reset = el('button', 'reset', 'Put back Wordsmith’s draft')
      reset.type = 'button'
      var foot = el('span', n.updatedAt ? 'saved' : '', n.updatedAt ? 'Saved' : '')
      f2.appendChild(reset); f2.appendChild(foot)
      b2.appendChild(f2)
      card.appendChild(b2)

      var b3 = el('div', 'block')
      b3.appendChild(el('div', 'label', 'Why Wordsmith wrote it this way'))
      b3.appendChild(el('p', 'why', c.why))
      card.appendChild(b3)

      var b4 = el('div', 'block')
      var l4 = el('label', 'label', 'Your thoughts on this statement')
      var tb = el('textarea', 'thoughts')
      tb.id = 'th-' + c.id
      l4.htmlFor = tb.id
      tb.placeholder = 'Is it usable? What would you change, and why?'
      tb.value = n.thoughts || ''
      b4.appendChild(l4); b4.appendChild(tb)
      card.appendChild(b4)

      ta.addEventListener('input', function () {
        notes[c.id] = notes[c.id] || {}
        notes[c.id].edited = ta.value === c.statement ? null : ta.value
        save(c.id, foot)
      })
      tb.addEventListener('input', function () {
        notes[c.id] = notes[c.id] || {}
        notes[c.id].thoughts = tb.value
        save(c.id, foot)
      })
      reset.addEventListener('click', function () {
        ta.value = c.statement
        notes[c.id] = notes[c.id] || {}
        notes[c.id].edited = null
        save(c.id, foot)
      })
      host.appendChild(card)
    })
  }

  Array.prototype.forEach.call(document.querySelectorAll('nav.styles button'), function (b) {
    b.addEventListener('click', function () {
      current = b.getAttribute('data-style')
      Array.prototype.forEach.call(document.querySelectorAll('nav.styles button'), function (x) {
        x.setAttribute('aria-pressed', String(x === b))
      })
      render()
    })
  })

  render()

  if (window.claude && window.claude.use) {
    window.claude.use('db').then(function (d) {
      if (!d) { setStatus('This view cannot save. Open the page on claude.ai to keep your edits and thoughts.', true); return }
      db = d
      return db.collection('notes').get().then(function (snap) {
        var docs = (snap && snap.docs) || snap || []
        docs.forEach(function (doc) {
          var id = doc.id || (doc.ref && doc.ref.id)
          var v = typeof doc.data === 'function' ? doc.data() : (doc.data || doc)
          if (id && v) { notes[id] = v }
        })
        setStatus('Your edits and thoughts save as you type.')
        render()
      })
    }).catch(function () { setStatus('Could not load earlier notes. New typing still tries to save.', true) })
  } else {
    setStatus('This view cannot save. Open the page on claude.ai to keep your edits and thoughts.', true)
  }
})()
</script>
